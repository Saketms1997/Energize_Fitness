workflows:
  # 3) Android: builds an installable release APK (no Apple account needed).
  # Uses android/key.properties if present, otherwise the debug key, which is
  # fine for installing directly on phones but not for Google Play.
  android-apk:
    name: Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Test
        script: flutter test
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - madhup.singhal@genus.in

  # 1) No Apple account needed: proves the app compiles for iOS.
  ios-build-check:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        script: flutter test
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  # 2) Signed build uploaded to TestFlight. Needs an Apple Developer account.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic   # name of the App Store Connect API key in Codemagic > Teams > Integrations
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: in.genus.gymManagementSystem
      vars:
        BUNDLE_ID: in.genus.gymManagementSystem
        APP_STORE_APPLE_ID: 0000000000   # TODO: numeric Apple ID of the app in App Store Connect
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build number from TestFlight
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo 0)
          echo "BUILD_NUMBER=$((LATEST + 1))" >> $CM_ENV
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - madhup.singhal@genus.in
